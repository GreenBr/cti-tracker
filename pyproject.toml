[project]
name = "cti-tracker"
version = "0.1.0"
description = "Track PRC-related cyber attack intel from public reports and news"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "requests>=2.32",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "datasette>=0.65",
    "datasette-dashboards>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cti = "cti.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cti"]

[tool.pytest.ini_options]
testpaths = ["tests"]

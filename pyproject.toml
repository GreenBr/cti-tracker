[project]
name = "cti-tracker"
version = "0.1.0"
description = "Track PRC-related cyber attack intel from public reports and news"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "requests>=2.32",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "datasette>=0.65",
    "datasette-dashboards>=0.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "babel>=2.16",
    "opencc-python-reimplemented>=0.1.7",
    "starlette-babel>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
cti = "cti.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cti", "cti.web"]

[tool.setuptools.package-data]
cti = ["web/templates/*.html", "web/static/*", "web/static/vendor/*", "translations/*.pot", "translations/*/LC_MESSAGES/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
